<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Liveness Check</title>
    <!-- External libraries -->
    <script src="tfjs.js"></script>
    <script src="blazeface.js"></script>
    <script src="face-landmarks-detection.js"></script>
    <script src="face-api.min.js"></script>
    <style>
        /* Full page styling for centering */
        :root {
            color-scheme: dark;
            --bg: #07111f;
            --panel: #101d31;
            --muted: #9fb0c8;
            --accent: #55d6be;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background: radial-gradient(circle at top, #17304d, var(--bg) 60%);
            color: #f5f8fc;
        }

        /* Main container styling */
        #main {
            text-align: center;
            width: min(94vw, 780px);
            background: rgba(16, 29, 49, .94);
            padding: clamp(18px, 4vw, 34px);
            border: 1px solid rgba(159, 176, 200, .2);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
        }

        .video-container {
            position: relative;
            width: min(100%, 640px);
            aspect-ratio: 4 / 3;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid rgba(85, 214, 190, .45);
            border-radius: 18px;
            background: #02060c;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .35);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
            /* Ensure the canvas does not block interaction with the video */
        }

        #message {
            margin: 18px 0 8px;
            font-size: 17px;
            font-weight: bold;
            color: var(--accent);
        }

        #matchMessage {
            color: var(--muted);
            min-height: 24px;
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
            margin: 0 0 12px;
        }

        button {
            margin: 8px 4px;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: transform .2s, filter .2s;
        }

        button:hover:enabled {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .disabled {
            background-color: #334155;
            color: #94a3b8;
            cursor: not-allowed;
        }

        #proceedButton {
            background-color: #28a745;
            color: white;
        }

        #authenticateButton {
            background-color: #007BFF;
            color: white;
        }
    </style>
</head>

<body>
    <div id="main">
        <h1>Face Authentication</h1>
        <p class="hint">Keep your face centered, then complete the spoof, smile, and blink checks.</p>
        <div class="video-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="output"></canvas>
        </div>
        <div id="message">Ready to start</div>
        <p id="matchMessage" style="font-size: 18px; font-weight: bold; margin-top: 20px;"></p>
        <button id="proceedButton" class="disabled" disabled>Proceed</button>
        <button id="authenticateButton">Authenticate</button>

    </div>

    <script src="./script.js"></script> <!-- Replace with the actual path to your JS file -->
    <script>
        document.getElementById('authenticateButton').addEventListener('click', () => {
            const base64Image = 'mypic2.jpg'; // Replace with actual base64 image data
            const videoElement = 'video'; // Replace with actual video element ID or reference
            const message = 'message';
            const parameter5 = 5; // Replace with actual parameter value
            const parameter6 = 54; // Replace with actual parameter value
            const pythonServerApiPM = 'http://example.com/api'; // Replace with actual API endpoint
            const userDetailsFAPM = { username: 'example', password: 'example123' }; // Replace with actual user details
            const apiSwitchFlag = true; // Replace with actual flag value

            aware.start(base64Image, videoElement, message, parameter5, parameter6, pythonServerApiPM, userDetailsFAPM, apiSwitchFlag)
                .catch((error) => {
                    console.error(error);
                });
        });
    </script>
</body>

</html>
